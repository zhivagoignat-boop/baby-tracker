<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Трекер малыша</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --tg-theme-bg-color: #ffffff;
      --tg-theme-text-color: #000000;
      --tg-theme-hint-color: #999999;
      --tg-theme-link-color: #2481cc;
      --tg-theme-button-color: #2481cc;
      --tg-theme-button-text-color: #ffffff;
      --tg-theme-secondary-bg-color: #f4f4f5;
    }
    body {
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior: none;
    }
    .card { background: var(--tg-theme-secondary-bg-color); border-radius: 16px; }
    .btn-primary {
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
    }
    .tab-active { border-bottom: 3px solid var(--tg-theme-button-color); color: var(--tg-theme-button-color); }
    .hidden { display: none !important; }
    .timer { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-screen pb-24">
  <!-- Header -->
  <header class="sticky top-0 z-20 bg-[var(--tg-theme-bg-color)] border-b border-gray-200 px-4 py-3 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-bold" id="childName">Трекер малыша</h1>
      <p class="text-xs text-[var(--tg-theme-hint-color)]" id="childAge"></p>
    </div>
    <button onclick="showScreen('profile')" class="text-2xl">👶</button>
  </header>

  <!-- Main content -->
  <main id="app" class="px-3 py-4 space-y-4">
    <!-- Loading -->
    <div id="loading" class="text-center py-20">
      <div class="text-4xl mb-3">🍼</div>
      <p>Загрузка...</p>
    </div>
  </main>

  <!-- Bottom navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[var(--tg-theme-bg-color)] border-t border-gray-200 flex justify-around py-2 z-20">
    <button onclick="showScreen('home')" class="nav-btn flex flex-col items-center text-xs p-1" data-screen="home">
      <span class="text-xl">🏠</span><span>Главная</span>
    </button>
    <button onclick="showScreen('track')" class="nav-btn flex flex-col items-center text-xs p-1" data-screen="track">
      <span class="text-xl">📝</span><span>Отметить</span>
    </button>
    <button onclick="showScreen('dev')" class="nav-btn flex flex-col items-center text-xs p-1" data-screen="dev">
      <span class="text-xl">📈</span><span>Развитие</span>
    </button>
    <button onclick="showScreen('stats')" class="nav-btn flex flex-col items-center text-xs p-1" data-screen="stats">
      <span class="text-xl">📊</span><span>Статистика</span>
    </button>
    <button onclick="showScreen('more')" class="nav-btn flex flex-col items-center text-xs p-1" data-screen="more">
      <span class="text-xl">⋯</span><span>Ещё</span>
    </button>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
